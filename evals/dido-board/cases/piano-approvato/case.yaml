expected_outcome: |
  Il piano M1 diventa approvato e la board del Project collegato ha una issue per ognuno dei quattro step, in Ready perché il piano non ha domande aperte, con un titolo da persona, cosa fa lo step, i repo, il link al piano e nell'ultima riga il suo step ("Step N del piano M1"). Nessun comando gh fuori dallo script, nessun codice cambiato, nessun commit.
