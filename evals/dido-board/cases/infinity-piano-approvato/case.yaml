schema_version: "1.1"
name: infinity-piano-approvato
expected_outcome: |
  Il repo usa una board di Infinity (docs/plans/board.json), non un GitHub Project. Il piano M1 diventa approvato e la board di Infinity ha una card per ognuno dei quattro step, nella colonna "To-do" che la config dà a Ready, con un titolo da persona, cosa fa lo step, i repo, il link al piano e nell'ultima riga il suo step ("Step N del piano M1"). Niente chiamate a Infinity o a gh fuori dallo script, nessun codice cambiato, nessun commit.
